<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Max-Mend</title>
        <link rel="icon" type="image/png" href="assets/icon/icon.png" />
        <link rel="stylesheet" href="style/main.css" />
        <link rel="stylesheet" href="style/style.css?v=4" />
    </head>
    <body>
        <header class="site-header">
            <div class="header-avatar">
                <img src="https://github.com/Max-Mend.png" />
            </div>
            <span class="header-title">Max-Mend</span>
        </header>

        <main>
            <div class="hero-wrapper">
                <div class="usr-icon">
                    <img src="https://github.com/Max-Mend.png" />
                </div>

                <div class="arrow-down">
                    <img src="assets/svg/arrow_down.svg" />
                </div>
            </div>

            <div class="content">
                <section class="about">
                    <h2>About Me</h2>
                    <p>
                        Hi 👋 I'm Max, a developer from Chernivtsi, Ukraine. I
                        write in C, C++, and Rust.
                    </p>
                </section>

                <section class="stack">
                    <h2>Tech Stack</h2>
                    <div class="stack-icons">
                        <img src="https://skillicons.dev/icons?i=c" alt="C" />
                        <img
                            src="https://skillicons.dev/icons?i=cpp"
                            alt="C++"
                        />
                        <img
                            src="https://skillicons.dev/icons?i=rust"
                            alt="Rust"
                        />
                    </div>
                </section>

                <section class="projects">
                    <h2>Projects</h2>
                    <div class="projects-grid" id="projects-grid">
                        <p class="projects-loading">Loading repositories…</p>
                    </div>
                </section>

                <section class="github-stats">
                    <h2>GitHub Stats</h2>
                    <div class="github-stats-custom" id="stats-custom">
                        <p class="projects-loading">Loading stats…</p>
                    </div>
                </section>

                <section class="contact">
                    <h2>Contact</h2>
                    <div class="contact-links">
                        <a href="https://github.com/Max-Mend" target="_blank"
                            >GitHub</a
                        >
                        <a href="https://ko-fi.com/maxmend" target="_blank"
                            >Ko-fi</a
                        >
                    </div>
                </section>
            </div>
        </main>

        <script src="script/scroll-header.js?v=4"></script>
        <script src="script/scroll-reveal.js?v=4"></script>
        <script src="script/projects.js?v=4"></script>
        <script src="script/github-stats.js?v=4"></script>
    </body>
</html>
